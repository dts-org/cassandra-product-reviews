services:
  cassandra-node1:
     image: cassandra:4.1
     container_name: cassandra-node1
     hostname: cassandra-node1
     networks:
       - cassandra-network
     ports:
       - "9042:9042"
     environment:
       - CASSANDRA_CLUSTER_NAME=WebAppCluster
       - CASSANDRA_DC=datacenter1
       - CASSANDRA_RACK=rack1
       - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
       - CASSANDRA_SEEDS=cassandra-node1
       - MAX_HEAP_SIZE=512M
       - HEAP_NEWSIZE=100M
     healthcheck:
       test: ["CMD-SHELL", "cqlsh -e 'describe cluster'"]
       interval: 30s
       timeout: 10s
       retries: 5

  cassandra-node2:
     image: cassandra:4.1
     container_name: cassandra-node2
     hostname: cassandra-node2
     networks:
      - cassandra-network
     ports:
      - "9043:9042"
     environment:
       - CASSANDRA_CLUSTER_NAME=WebAppCluster
       - CASSANDRA_DC=datacenter1
       - CASSANDRA_RACK=rack1
       - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
       - CASSANDRA_SEEDS=cassandra-node1
       - MAX_HEAP_SIZE=512M
       - HEAP_NEWSIZE=100M
     depends_on:
        cassandra-node1:
          condition: service_healthy
     healthcheck:
        test: ["CMD-SHELL", "cqlsh -e 'describe cluster'"]
        interval: 30s
        timeout: 10s
        retries: 5

  cassandra-node3:
    image: cassandra:4.1
    container_name: cassandra-node3
    hostname: cassandra-node3
    networks:
       - cassandra-network
    ports:
      - "9044:9042"
    environment:
        - CASSANDRA_CLUSTER_NAME=WebAppCluster
        - CASSANDRA_DC=datacenter1
        - CASSANDRA_RACK=rack1
        - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
        - CASSANDRA_SEEDS=cassandra-node1
        - MAX_HEAP_SIZE=512M
        - HEAP_NEWSIZE=100M
    depends_on:
      cassandra-node2:
        condition: service_healthy
    healthcheck:
        test: ["CMD-SHELL", "cqlsh -e 'describe cluster'"]
        interval: 30s
        timeout: 10s
        retries: 5

networks:
  cassandra-network:
    driver: bridge
